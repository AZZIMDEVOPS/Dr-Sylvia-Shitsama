name: Build Android APK & App Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: List Generated APK Files
        run: find android/app/build/outputs/ -type f || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-sylvia-app-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Build Release Bundle (AAB for Google Play)
        continue-on-error: true
        run: cd android && ./gradlew bundleRelease --stacktrace

      - name: Upload Release AAB Artifact (Google Play)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-sylvia-app-release-aab
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 14
