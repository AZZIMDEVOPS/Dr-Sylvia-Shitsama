name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (IPA & Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Show Xcode & SDK Versions
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build iOS Archive (Unsigned)
        run: |
          mkdir -p ios/App/build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/App/build/App.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p ios/App/build/Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r -q DrSylviaShitsama-unsigned.ipa Payload
          zip -r -q DrSylviaShitsama.xcarchive.zip App.xcarchive

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/App/build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

          cd ios/App/build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r -q "$GITHUB_WORKSPACE/ios/App/build/DrSylviaShitsama-Simulator.zip" App.app

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-sylvia-app-ios-ipa
          path: ios/App/build/DrSylviaShitsama-unsigned.ipa
          retention-days: 14

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-sylvia-app-ios-simulator
          path: ios/App/build/DrSylviaShitsama-Simulator.zip
          retention-days: 14

      - name: Upload Xcode Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-sylvia-app-ios-xcarchive
          path: ios/App/build/DrSylviaShitsama.xcarchive.zip
          retention-days: 14
