name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (IPA & Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Show Xcode & SDK Versions
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build iOS IPA & Simulator App
        run: |
          chmod +x scripts/build-ios.sh
          ./scripts/build-ios.sh

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-sylvia-app-ios-ipa
          path: ios/App/build/DrSylviaShitsama-unsigned.ipa
          retention-days: 14

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-sylvia-app-ios-simulator
          path: ios/App/build/DrSylviaShitsama-Simulator.zip
          retention-days: 14
