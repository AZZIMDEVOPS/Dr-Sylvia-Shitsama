<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" fill="none">
  <defs>
    <!-- Rich 3D Metallic Amber & Copper Gold Gradients for Brain & Spine -->
    <linearGradient id="brainGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="vertebraeGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="subtleShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Refined Drop Shadow for 3D Relief Effect -->
    <filter id="clinicDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#D97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="logo-root" filter="url(#clinicDepth)">
    
    <!-- ============================================== -->
    <!-- 1. THE ANATOMICAL EMBLEM: HEAD, BRAIN & SPINE   -->
    <!-- ============================================== -->
    <g id="emblem-group" transform="translate(12, 6)">
      
      <!-- Solid White / Dark Ribbon Outline of Head Profile & Spine Column -->
      <!-- Exactly matching the physical clinic sign: facing right, occiput left, S-curve spine -->
      <path
        d="
          M 55 10
          C 82 10, 102 26, 106 50
          C 107 55, 104 60, 101 64
          C 104 66, 108 70, 107 75
          C 105 78, 100 80, 100 83
          C 100 86, 104 88, 103 92
          C 101 95, 96 96, 95 99
          C 93 103, 95 107, 92 110
          C 87 114, 78 115, 70 115
          C 65 115, 62 111, 65 108
          C 72 107, 80 106, 83 102
          C 85 100, 83 98, 85 95
          C 87 92, 92 91, 92 88
          C 92 85, 87 83, 88 79
          C 89 75, 94 74, 94 70
          C 94 66, 88 62, 91 56
          C 94 50, 96 42, 91 32
          C 84 20, 72 17, 55 17
          C 35 17, 24 29, 22 46
          C 20 63, 26 78, 30 90
          C 36 102, 38 116, 34 136
          C 30 156, 24 176, 24 198
          C 24 220, 18 238, 9 250
          C 17 240, 27 218, 31 196
          C 35 174, 41 154, 44 134
          C 47 114, 43 102, 37 88
          C 31 74, 28 62, 29 46
          C 31 25, 41 10, 55 10
          Z
        "
        fill="#FFFFFF"
      />

      <!-- Golden Brain Inside Cranial Vault -->
      <g id="cerebral-cortex" filter="url(#goldGlow)">
        <!-- Anatomical lobes contour wash -->
        <path
          d="
            M 42 22
            C 52 18, 66 18, 76 22
            C 84 26, 90 34, 90 44
            C 90 52, 85 60, 78 64
            C 70 68, 58 68, 50 66
            C 42 64, 34 60, 32 50
            C 30 40, 34 28, 42 22
            Z
          "
          fill="url(#brainGold)"
          opacity="0.18"
        />

        <!-- Contoured Gyri & Sulci Maze (Warm 3D Relief Folds) -->
        <path
          d="
            M 38 32
            C 44 26, 54 24, 62 26
            C 70 28, 68 36, 60 38
            C 52 40, 46 36, 42 42
            C 38 48, 46 54, 54 52
            C 62 50, 64 44, 70 42
            C 78 40, 84 44, 85 52
            C 86 58, 80 64, 72 64
            C 64 64, 60 58, 54 60
            C 48 62, 46 66, 52 68
          "
          fill="none"
          stroke="url(#brainGold)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="
            M 52 24
            C 60 22, 70 22, 78 26
            C 84 30, 86 38, 82 42
            C 78 46, 70 42, 66 46
            C 62 50, 68 56, 64 60
          "
          fill="none"
          stroke="url(#brainGold)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="
            M 44 40
            C 46 36, 52 34, 56 36
            C 60 38, 58 44, 54 46
            C 50 48, 46 46, 44 50
            C 42 54, 48 58, 52 58
          "
          fill="none"
          stroke="url(#brainGold)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="
            M 68 30
            C 72 32, 74 36, 72 40
            C 70 44, 64 44, 64 48
          "
          fill="none"
          stroke="url(#brainGold)"
          stroke-width="3.5"
          stroke-linecap="round"
        />
      </g>

      <!-- Graduated Golden Vertebral Discs (Natural S-Curved Spine Chain) -->
      <g id="vertebrae-chain" filter="url(#goldGlow)">
        <!-- Cervical Discs (tapering from cranium into neck) -->
        <circle cx="47" cy="74" r="3.0" fill="url(#vertebraeGold)" />
        <circle cx="45" cy="84" r="3.6" fill="url(#vertebraeGold)" />
        <ellipse cx="43" cy="94" rx="4.4" ry="4.0" fill="url(#vertebraeGold)" />

        <!-- Thoracic Vertebrae (following the natural thoracic kyphosis curve) -->
        <ellipse cx="41.5" cy="106" rx="5.2" ry="4.8" fill="url(#vertebraeGold)" />
        <ellipse cx="40.5" cy="119" rx="6.2" ry="5.6" fill="url(#vertebraeGold)" />
        <ellipse cx="40.5" cy="133" rx="7.2" ry="6.4" fill="url(#vertebraeGold)" />
        <ellipse cx="41.5" cy="148" rx="8.2" ry="7.2" fill="url(#vertebraeGold)" />

        <!-- Lumbar Vertebrae (maximum volume, natural inward lordosis curve) -->
        <ellipse cx="43.5" cy="164" rx="8.8" ry="7.8" fill="url(#vertebraeGold)" />
        <ellipse cx="44.5" cy="180" rx="8.5" ry="7.4" fill="url(#vertebraeGold)" />

        <!-- Lower Lumbar & Sacrum (gracefully tapering to sacral apex) -->
        <ellipse cx="43.5" cy="196" rx="7.5" ry="6.6" fill="url(#vertebraeGold)" />
        <ellipse cx="41.0" cy="210" rx="6.4" ry="5.4" fill="url(#vertebraeGold)" />
        <ellipse cx="37.0" cy="223" rx="5.2" ry="4.2" fill="url(#vertebraeGold)" />
        <ellipse cx="32.0" cy="234" rx="4.0" ry="3.2" fill="url(#vertebraeGold)" />
        <ellipse cx="26.0" cy="244" rx="2.8" ry="2.2" fill="url(#vertebraeGold)" />
        <circle cx="20.0" cy="251" r="1.6" fill="url(#vertebraeGold)" />
      </g>
    </g>

    <!-- ============================================== -->
    <!-- 2. CLINIC TYPOGRAPHY: SAGE / BRAIN & SPINE / CLINIC -->
    <!-- ============================================== -->
    <g id="typography-group" transform="translate(136, 12)">
      
      <!-- SAGE (Bold, condensed display letters matching the acrylic sign) -->
      <text
        x="0"
        y="86"
        font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', 'DM Sans', serif"
        font-size="84"
        font-weight="700"
        letter-spacing="0.04em"
        fill="#FFFFFF"
      >
        SAGE
      </text>

      <!-- BRAIN & SPINE (Amber / Copper Gold, prominent sub-bar) -->
      <g transform="translate(2, 102)">
        <text
          x="0"
          y="28"
          font-family="'DM Sans', 'Inter', -apple-system, sans-serif"
          font-size="28"
          font-weight="800"
          letter-spacing="0.14em"
          fill="url(#brainGold)"
        >
          BRAIN &amp; SPINE
        </text>
      </g>

      <!-- CLINIC (Bold display letters matching SAGE) -->
      <text
        x="0"
        y="218"
        font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', 'DM Sans', serif"
        font-size="84"
        font-weight="700"
        letter-spacing="0.04em"
        fill="#FFFFFF"
      >
        CLINIC
      </text>
    </g>

  </g>
</svg>